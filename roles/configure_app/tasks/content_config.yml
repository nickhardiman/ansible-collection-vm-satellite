---

# https://console.redhat.com/ansible/automation-hub/collections/published/redhat/satellite/documentation/role/$ROLE
# $ROLE is settings, manifest, repositories, lifecycle_environments, etc. 
- name: "Run Satellite roles"
  ansible.builtin.include_role:
    name: "{{ l_role }}"
  loop:
    - redhat.satellite.lifecycle_environments  # see variable satellite_lifecycle_environments
    - redhat.satellite.content_views           # see variables satellite_organization and satellite_content_views
    - redhat.satellite.content_view_publish    # also uses satellite_content_views
    - redhat.satellite.activation_keys         # see variable satellite_activation_keys
  loop_control:
    loop_var: l_role

  # https://console.redhat.com/ansible/automation-hub/repo/published/redhat/satellite/content/module/sync_plan/
  # usng a dynamically set date (relative to now) means this is always changed, never OK (unchanged). 
- name: "Create daily sync plan for all products"
  redhat.satellite.sync_plan:
    server_url:   "{{ satellite_server_url }}"
    username:     "{{ satellite_username }}"
    password:     "{{ satellite_password }}"
    organization: "{{ satellite_organization }}"
    name: "Daily Sync"
    interval: "daily"    #  hourly, daily, weekly, custom cron
    enabled: true
    # sync_date: "{{ lookup('ansible.builtin.pipe', 'date +\"%Y-%m-%d %H:%M:%S %Z\"') }}"  # now
    # sync_date: "2017-01-01 00:00:00 UTC" # fixed date
    sync_date: "{{ lookup('ansible.builtin.pipe', 'date +\"%Y-%m-%d 10:00:00 %Z\" -d \"+1 day\"') }}"  
# 10am tomorrow
    products: "{{ satellite_products | map(attribute='name') | list }}"
    state: present

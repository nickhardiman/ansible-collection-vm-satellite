- name: "No DNS yet so update /etc/hosts for gateway"
  ansible.builtin.include_role:
    name: nickhardiman.platform.hosts_record
  vars:
    hosts_record_conf:
      ip_address: "{{ lab_net_prefix }}.3"
      fqdn: "{{ server_proxy_fqdn }}"
      host: "{{ server_proxy_hostname }}"

- name: "Add server certificate for {{ roles_add_fqdn }}"
  ansible.builtin.include_role:
    name: nickhardiman.platform.register_rhc
  vars:
    register_rhc_conf:
      rhsm_user: "{{ rhsm_user }}"
      rhsm_password: "{{ rhsm_password }}"
      behind_a_proxy: true
      server_proxy_hostname: "{{ server_proxy_fqdn }}"
      server_proxy_port: "{{ server_proxy_port }}"

# !!! Post-Quantum Cryptography (PQC) public key install breaks redhat.rhel_system_roles.rhc
- name: Handle new RHEL10 bug https://access.redhat.com/solutions/7136991
  ansible.builtin.dnf:
    name: redhat-release
    state: latest


- name: "Add roles that don't need extra vars"
  ansible.builtin.include_role:
    name: "{{ l_role }}"
  loop:
    - nickhardiman.platform.managed_node
    - nickhardiman.platform.latest_packages
    - nickhardiman.platform.smtp_client
    - nickhardiman.platform.cockpit_server
    - nickhardiman.platform.register_insights
    # !!! add time_server?
    # https://hardiman.consulting/rhel/9/time/chrony.html
  loop_control:
    loop_var: l_role

- name: "Add server certificate for {{ roles_add_fqdn }}"
  ansible.builtin.include_role:
    name: nickhardiman.platform.server_cert
  vars:
    server_cert_config: "{{ roles_add_server_cert_config }}"
